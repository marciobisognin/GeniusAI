name: GeniusAI Foresight CI

on:
  push:
    paths:
      - "geniusai-foresight/**"
      - ".github/workflows/geniusai-foresight-ci.yml"
  pull_request:
    paths:
      - "geniusai-foresight/**"
      - ".github/workflows/geniusai-foresight-ci.yml"

permissions:
  contents: read

# No event-controlled strings are interpolated into shell commands.
jobs:
  validate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: geniusai-foresight
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned QA tools
        run: python -m pip install --disable-pip-version-check build==1.3.0 bandit==1.8.6 pyflakes==3.4.0
      - name: Compile
        run: python -m compileall -q foresight scripts tests hermes_plugin
      - name: Static analysis
        run: |
          pyflakes foresight scripts tests hermes_plugin
          bandit -q -r foresight scripts hermes_plugin
          python scripts/scan_secrets.py --root .
      - name: Validate squad
        run: python scripts/validate_squad.py --root .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build and inspect distribution
        run: |
          python -m build
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              entry_points = archive.read(next(n for n in names if n.endswith("entry_points.txt"))).decode()
          assert any(name.endswith("LICENSE") for name in names), names
          for required in ("hermes_plugin/__init__.py", "hermes_plugin/plugin.yaml", "hermes_plugin/skills/foresight-cycle/SKILL.md"):
              assert required in names, (required, names)
          assert "hermes_agent.plugins" in entry_points, entry_points
          PY
      - name: Install package and execute canonical demo
        run: |
          python -m pip install --force-reinstall --no-deps .
          geniusai-foresight validate --input examples/soy-trade-shock.json
          geniusai-foresight demo --output generated/ci-demo
      - name: Load the Hermes plugin from the installed package
        run: |
          python - <<'PY'
          from importlib.metadata import entry_points
          import json, tempfile, os
          # Fora da árvore de fontes de propósito: prova que o plug-in acha o
          # kernel e a fixture demonstrativa pela instalação, não pelo repo.
          os.chdir(tempfile.gettempdir())
          plugins = list(entry_points(group="hermes_agent.plugins"))
          assert [plugin.name for plugin in plugins] == ["genius-foresight"], plugins
          register = plugins[0].load()

          class Context:
              def __init__(self):
                  self.tools, self.skills = {}, {}
              def register_tool(self, *, name, toolset, schema, handler, **kwargs):
                  assert toolset == "foresight", toolset
                  self.tools[name] = handler
              def register_skill(self, name, path):
                  self.skills[name] = path

          ctx = Context()
          register(ctx)
          assert len(ctx.tools) == 6, sorted(ctx.tools)
          assert ctx.skills["foresight-cycle"].is_file(), ctx.skills
          assert json.loads(ctx.tools["foresight_game"]({"fixture": "stag-hunt"}))["status"] == "analyzed"
          # Handler nunca levanta: entrada inválida vira envelope de erro.
          assert json.loads(ctx.tools["foresight_validate"]({}))["status"] == "error"
          with tempfile.TemporaryDirectory() as output:
              result = json.loads(ctx.tools["foresight_demo"]({"output_dir": f"{output}/demo"}))
          assert result["status"] == "completed_research_only", result
          assert result["gate"]["status"] == "go_research_only", result
          PY
      - name: Verify artifacts and deterministic replay
        run: |
          geniusai-foresight replay --input examples/soy-trade-shock.json --expected generated/ci-demo/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("generated/ci-demo")
          for name in ("result.json", "report.md", "report.html"):
              path = root / name
              assert path.is_file() and path.stat().st_size > 100, name
          result = json.loads((root / "result.json").read_text(encoding="utf-8"))
          assert result["runs"] == 600
          assert len(result["workflow"]) == 8
          assert all("mcse" in item for item in result["event_uncertainty"].values())
          assert abs(sum(item["probability"] for item in result["scenarios"]) - 1.0) < 1e-9
          assert len(result["trace"]) == 24
          PY
